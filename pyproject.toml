[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tribal-data-sovereignty-toolkit"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6,<7",
    "pandas>=2,<3",
    "geopandas>=0.14,<2",
    "shapely>=2.0",
    "requests>=2.31,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbmake>=1.5,<2", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["toolkit*"]
