nation:
  name: '[Nation name]'
  collective: null
  territory: '[Territory]'
  census_name: ''
  language: null
  demonym: null
territory:
  bbox: null
  centroid: null
provenance:
  treaty_name: ''
  treaty_territory: ''
  treaty_status: '[Applicable Nation-defined governance authority; treaty if relevant]'
  legal_citations: []
  subsurface_note: ''
stewardship:
  department: '[Designated data steward]'
  contact_url: ''
  contact_note: '[Review and return process]'
frameworks:
  ocap:
    enabled: false
    reference: https://fnigc.ca/ocap-training/
    note: First Nations-specific principles. Enable only after the Nation determines
      applicability.
  care:
    enabled: true
    reference: https://www.gida-global.org/care
    note: 'CARE Principles: Collective Benefit, Authority to Control, Responsibility,
      Ethics. Governs ethical obligations that FAIR alone does not address.'
  fair:
    enabled: true
    reference: https://www.go-fair.org/fair-principles/
    note: 'FAIR Principles: Findable, Accessible, Interoperable, Reusable. Governs
      technical standards for data management.'
  ieee_2890:
    enabled: true
    reference: https://standards.ieee.org/ieee/2890/10318/
    note: Recommended Practice for Provenance of Indigenous Peoples' Data. Toolkit
      conformance has not been established.
  local_contexts:
    enabled: false
    reference: https://localcontexts.org/
    label_type: null
data_classification:
  tiers:
  - id: PUBLIC
    label: Public
    description: Access tier intended for public use after applicable publication
      review. Classification alone does not establish authorization.
    examples:
    - Published environmental monitoring summaries
    - Aggregated climate statistics
  - id: COMMUNITY
    label: 'Community: authorized members and partners'
    description: Data intended for Tribal members and community partners. Not for
      general public release.
    examples:
    - Detailed water quality sampling locations
    - Community health data aggregates
  - id: RESTRICTED
    label: 'Restricted: Tribal governance only'
    description: Sensitive data restricted to Tribal governance bodies and authorized
      staff. Requires explicit Tribal authorization to share.
    examples:
    - Sacred site locations
    - Individual health or economic records
    - Traditional knowledge documentation
attribution:
  citation_format: '[Nation-reviewed attribution]'
  acknowledgment: '[Nation-reviewed acknowledgment]'
handling:
  approved_storage: '[Nation-approved storage]'
  version_control: prohibited unless explicitly authorized
  publication_status: pending
  retention_review: '[Date or agreed trigger]'
analysis:
  state_code: null
  divisions: []
  spatial_rationale: ''
  start_year: 1980
teaching: false
